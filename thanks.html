<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - A & K Analytics</title>
    <meta name="description" content="Thank you for contacting A & K Analytics. We will be in touch shortly.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .thanks-section {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
        }
        .thanks-icon {
            font-size: 72px;
            color: #00bcd4;
            margin-bottom: 24px;
        }
        .thanks-section h1 {
            font-size: 2.5rem;
            color: #1a1a2e;
            margin-bottom: 16px;
        }
        .thanks-section p {
            font-size: 1.125rem;
            color: #555;
            max-width: 520px;
            margin: 0 auto 32px;
            line-height: 1.7;
        }
        .thanks-section .btn-home {
            display: inline-block;
            padding: 14px 32px;
            background: #00bcd4;
            color: #fff;
            border-radius: 4px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .thanks-section .btn-home:hover {
            background: #0097a7;
        }
    </style>
</head>
<body>
    <section class="hero-section" style="min-height: unset; padding: 0;">
        <header>
            <div class="logo">A & K Analytics <span>Data Solutions</span></div>
            <nav id="main-nav">
                <ul>
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="about.html" class="nav-link">About</a></li>
                    <li><a href="blog.html" class="nav-link">Blog</a></li>
                    <li><a href="book-online.html" class="nav-link">Book Online</a></li>
                </ul>
            </nav>
        </header>
    </section>

    <div class="thanks-section">
        <div class="thanks-icon"><i class="fas fa-check-circle"></i></div>
        <h1>Thank You!</h1>
        <p>Your message has been received. A member of our team will get back to you within 1–2 business days.</p>
        <a href="index.html" class="btn-home">Back to Home</a>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="blog.html">Blog</a>
                <a href="book-online.html">Book Online</a>
            </div>
            <div class="footer-social">
                <a href="https://facebook.com/akanalytics" class="social-icon" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="https://twitter.com/akanalytics" class="social-icon" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="https://linkedin.com/company/akanalytics" class="social-icon" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                <a href="https://instagram.com/akanalytics" class="social-icon" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            </div>
            <div class="footer-copyright">
                <p id="thanks-copyright"></p>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('thanks-copyright').textContent = `© ${new Date().getFullYear()} A & K Analytics. All rights reserved.`;
    </script>
</body>
</html>
